# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md, the docs/ website, and the out/ JS library render from
# tera.templates/, loading config/*.lua with load_lua. config/jschess.lua
# holds the dependency table and the computed <script>-tag HTML fragments
# that the pydmt config/jschess.py generated (baked as values; regenerate only
# if the third-party deps change). Lua rather than the pydmt .py configs
# because version_str() reads a lowercase `tup` global and pylint would reject
# lowercase module constants.
[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
    "config/jschess.lua",
]
